name: Browser service - Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/browser/**'
      - 'tools/browser/**'
      - 'packages/**'
      - 'apps/docs/**'
      - 'apps/sheets/**'
      - 'apps/slides/**'
      - 'apps/pdf/**'
      - 'apps/markdown/**'
      - 'apps/html/**'
      - 'package*.json'
      - '.github/workflows/browser-windows.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Reuse the action revisions already pinned in the supplied repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - run: node tools/browser/check-prerequisites.mjs
      - run: npm ci
      - run: npm run browser:test
      - run: npm run browser:build
      - run: npx playwright install chromium
      - run: npm run browser:test:ui
      # This is a build/source-editor test gate. Rich-editor fidelity must still
      # be checked using the manual matrix in BROWSER-VALIDATION.md.
