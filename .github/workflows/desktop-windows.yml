name: Native desktop - Windows
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'e2e/**'
      - 'tools/**'
      - 'packaging/**'
      - 'test-files/**'
      - 'package*.json'
      - '.github/workflows/desktop-windows.yml'
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run check:security
      - run: npm run licenses
      - run: npm run build:all
      - name: Cache pinned text model for parity checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .task/embedding-parity-cache
          key: e5-small-q8-${{ runner.os }}-${{ runner.arch }}-761b726dd34fb83930e26aab4e9ac3899aa1fa78
      - run: node tools/check-embedding-parity.mjs
      - run: npm run check:renderer-budgets -- --report e2e/renderer-budgets.json
      - run: npm run test:e2e -- reliability.spec.ts
      - name: Install legacy Office conversion prerequisite
        run: choco install libreoffice-fresh --yes --no-progress
      - name: Build isolated validation installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run notices
          if ($LASTEXITCODE -ne 0) { throw 'Notice generation failed.' }
          $installerRun = (node test-files/windows-installer/prepare.mjs | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Installer preparation failed.' }
          "NAWA_INSTALLER_RUN=$installerRun" >> $env:GITHUB_ENV
          Push-Location apps/shell
          try {
            npx electron-builder --win --x64 --publish never --config "$installerRun/config.cjs"
            if ($LASTEXITCODE -ne 0) { throw 'Validation installer build failed.' }
          } finally { Pop-Location }
      - name: Validate installed application, upgrade and uninstall
        shell: pwsh
        run: ./test-files/windows-installer/validate.ps1 -RunDirectory $env:NAWA_INSTALLER_RUN -Reliability
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-reliability
          path: |
            e2e/test-results
            e2e/playwright-report
            e2e/artifacts
            e2e/renderer-budgets.json
            .task/windows-installer-*/installer-report.json
            .task/windows-installer-*/runtime-report.json
            .task/windows-installer-*/*.log
